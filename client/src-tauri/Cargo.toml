[package]
name = "discord-clone"
version = "1.0.0-alpha.1"
description = "A Discord Clone"
authors = ["goldstac"]
edition = "2021"

[lib]
name = "discord_clone_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
