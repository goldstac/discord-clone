services:
  - type: web
    name: discord-clone-server
    runtime: rust
    plan: starter
    buildCommand: cd server && cargo build --release --bin discord-clone-server
    startCommand: cd server && ./target/release/discord-clone-server
    envVars:
      - key: DATABASE_URL
        value: sqlite:/data/discord.db?mode=rwc
      - key: JWT_SECRET
        generateValue: true
      - key: RUST_VERSION
        value: "1.80"
    disk:
      mountPath: /data
      sizeGB: 1
